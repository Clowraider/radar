# Radar TRH canonical keyword dictionary
#
# Version this file in git and keep it editable. Dictionary changes can alter
# keyword matches, so run `scripts/extract_keywords.py --full --reset-period`
# after significant edits.
#
# Fields:
# - canonical: navigable/display name used by Radar
# - type: place | person | organization | topic | event | category
# - category: optional grouping for future UI filters
# - priority: editorial boost for ranking ties; higher wins
# - enabled: false disables the entry without deleting it
# - aliases: phrases that should normalize to `canonical`
# - omitted_keywords: phrases discarded from automatic extraction

version: 1
language: es

# Phrases to discard from automatic extraction. Use this for boilerplate,
# calls to action, buttons, and generic website text that can appear often
# but is not a real news topic.
omitted_keywords:
  - "click"
  - "clic"
  - "unirte al"
  - "unirse al"
  - "leer más"
  - "ver más"
  - "seguir leyendo"
  - "compartir"
  - "comentarios"
  - "whatsapp"
  - "facebook"
  - "instagram"
  - "twitter"
  - "HACÉ"
  - "HACÉ CLICK"
  - "Sin embargo"
  - "Mira"
  - "Mirá"
  - "Lee"
  - "Te recomendamos"
  - "Sin embargo"
  - 'Te recomendamos: La "vuelta'

